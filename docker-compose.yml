services:
  db:
    image: postgres:18-alpine
    container_name: next-tickers-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: tickets
      POSTGRES_PASSWORD: tickets
      POSTGRES_DB: next_tickers
    ports:
      - "5462:5432"
    volumes:
      # Postgres 18+ guarda los datos en /var/lib/postgresql/<versión>/docker
      - next-tickers-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tickets -d next_tickers"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  next-tickers-data:
